<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Horaires Rémi 45</title>

  <!-- CSS pour la Carte Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding: 16px; color: #333; }
    
    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    h1 { font-size: 1.3rem; color: #1a365d; margin-bottom: 12px; text-align: center; }
    h2 { font-size: 1.1rem; color: #2d3748; margin-bottom: 12px; }
    
    #status-box {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .vacances { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .scolaire { background-color: #e6fffa; color: #234e52; border: 1px solid #b2f5ea; }
    .error { background-color: #fed7d7; color: #9b2c2c; }

    .bus-info {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #2d3748;
      background: #edf2f7;
      padding: 16px;
      border-left: 5px solid #3182ce;
      border-radius: 8px;
    }

    .badge-20a { background: #3182ce; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
    .badge-20b { background: #38a169; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }

    #map {
      height: 250px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .tabs-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: #e2e8f0;
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      color: #4a5568;
    }
    .tab-btn.active {
      background: #3182ce;
      color: white;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      margin-bottom: 12px;
      outline: none;
    }
    .search-box:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    th, td {
      padding: 10px 6px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    th {
      background-color: #f7fafc;
      color: #4a5568;
      font-weight: bold;
    }
    tr:hover { background-color: #f7fafc; }
    .no-result {
      padding: 12px;
      color: #718096;
      font-style: italic;
      text-align: center;
    }

    /* --- MODE WIDGET (masque la carte et la grille) --- */
    body.widget-mode #map,
    body.widget-mode .card:nth-of-type(2) {
      display: none;
    }
    body.widget-mode {
      background: transparent;
      padding: 0;
    }
    body.widget-mode .card:first-of-type {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <!-- Card Prochain Bus -->
  <div class="card">
    <h1>🚍 Rémi 45 - Prochain Passage</h1>
    <div id="status-box">Vérification du calendrier...</div>
    <div id="bus-result" class="bus-info">Recherche de l'arrêt le plus proche via GPS...</div>
  </div>

  <!-- Carte Leaflet -->
  <div id="map"></div>

  <!-- Section Grille Horaire avec Recherche et Heures -->
  <div class="card">
    <h2>📋 Fiche Horaire Période Scolaire</h2>
    
    <div class="tabs-container" id="tabs"></div>

    <input 
      type="text" 
      id="search-destination" 
      class="search-box" 
      placeholder="🔍 Chercher une destination (ex: Stade, Rive du Bois, Orléans...)"
      oninput="filterHoraires()"
    />

    <div id="table-container"></div>
  </div>

  <!-- Scripts JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 0. Détection du Mode Widget dans l'URL (?mode=widget)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('mode') === 'widget') {
      document.body.classList.add('widget-mode');
    }

    let currentArretId = "orleans_gare";
    let userMarker = null;

    // 1. Données complètes
    const DATA = {
      arrets: [
        {
          id: "orleans_gare",
          nom: "ORLÉANS - Gare Routière",
          lat: 47.9080, lng: 1.9042,
          horaires: [
            {depart: "06:25", arrivee: "06:48", ligne: "20a", car: "Car 202", dest: "NEUVILLE (Stade)"},
            {depart: "07:20", arrivee: "07:43", ligne: "20a", car: "Car 206", dest: "NEUVILLE (Stade)"},
            {depart: "07:45", arrivee: "08:10", ligne: "20a", car: "Car 208", dest: "NEUVILLE (Stade)"},
            {depart: "08:00", arrivee: "08:29", ligne: "20b", car: "Car 2", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "09:00", arrivee: "09:23", ligne: "20a", car: "Car 210", dest: "NEUVILLE (Stade)"},
            {depart: "11:08", arrivee: "11:31", ligne: "20a", car: "Car 212", dest: "NEUVILLE (Stade)"},
            {depart: "11:35", arrivee: "11:58", ligne: "20a", car: "Car 214", dest: "NEUVILLE (Stade)"},
            {depart: "11:40", arrivee: "12:03", ligne: "20a", car: "Car 216", dest: "NEUVILLE (Stade)"},
            {depart: "12:25", arrivee: "12:54", ligne: "20b", car: "Car 4", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "12:30", arrivee: "12:53", ligne: "20a", car: "Car 218", dest: "NEUVILLE (Stade)"},
            {depart: "13:10", arrivee: "13:35", ligne: "20a", car: "Car 220", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "15:00", arrivee: "15:23", ligne: "20a", car: "Car 222", dest: "NEUVILLE (Stade)"},
            {depart: "16:05", arrivee: "16:28", ligne: "20a", car: "Car 224", dest: "NEUVILLE (Stade)"},
            {depart: "16:10", arrivee: "16:39", ligne: "20b", car: "Car 10", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "16:20", arrivee: "16:49", ligne: "20b", car: "Car 12", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "16:40", arrivee: "17:03", ligne: "20a", car: "Car 226", dest: "NEUVILLE (Stade)"},
            {depart: "17:15", arrivee: "17:44", ligne: "20b", car: "Car 14", dest: "NEUVILLE (Rive du Bois)"},
            {depart: "17:20", arrivee: "17:43", ligne: "20a", car: "Car 228", dest: "NEUVILLE (Stade)"},
            {depart: "18:35", arrivee: "19:04", ligne: "20b", car: "Car 22", dest: "NEUVILLE (Rive du Bois)"}
          ]
        },
        {
          id: "loury_eglise",
          nom: "LOURY - Place de l'Église",
          lat: 48.0011, lng: 2.0855,
          horaires: [
            {depart: "06:35", arrivee: "07:12", ligne: "20b", car: "Car 5", dest: "ORLÉANS Gare Routière"},
            {depart: "06:37", arrivee: "07:15", ligne: "20b", car: "Car 7", dest: "ORLÉANS Gare Routière"},
            {depart: "07:15", arrivee: "07:55", ligne: "20b", car: "Car 9", dest: "ORLÉANS Gare Routière"},
            {depart: "10:55", arrivee: "11:32", ligne: "20b", car: "Car 15", dest: "ORLÉANS Gare Routière"},
            {depart: "17:35", arrivee: "18:12", ligne: "20b", car: "Car 17", dest: "ORLÉANS Gare Routière"}
          ]
        },
        {
          id: "neuville_stade",
          nom: "NEUVILLE - Stade",
          lat: 48.0667, lng: 2.0538,
          horaires: [
            {depart: "06:25", arrivee: "07:12", ligne: "20b", car: "Car 5", dest: "ORLÉANS Gare Routière"},
            {depart: "06:25", arrivee: "07:15", ligne: "20b", car: "Car 7", dest: "ORLÉANS Gare Routière"},
            {depart: "06:48", arrivee: "07:22", ligne: "20a", car: "Car 1", dest: "ORLÉANS Gare Routière"},
            {depart: "07:00", arrivee: "07:35", ligne: "20a", car: "Car 3", dest: "ORLÉANS Gare Routière"},
            {depart: "07:05", arrivee: "07:55", ligne: "20b", car: "Car 9", dest: "ORLÉANS Gare Routière"},
            {depart: "07:35", arrivee: "08:15", ligne: "20a", car: "Car 5", dest: "ORLÉANS Gare Routière"},
            {depart: "10:45", arrivee: "11:32", ligne: "20b", car: "Car 15", dest: "ORLÉANS Gare Routière"},
            {depart: "12:57", arrivee: "13:30", ligne: "20a", car: "Car 7", dest: "ORLÉANS Gare Routière"},
            {depart: "13:57", arrivee: "14:30", ligne: "20a", car: "Car 11", dest: "ORLÉANS Gare Routière"},
            {depart: "14:07", arrivee: "14:40", ligne: "20a", car: "Car 13", dest: "ORLÉANS Gare Routière"},
            {depart: "16:51", arrivee: "17:25", ligne: "20a", car: "Car 17", dest: "ORLÉANS Gare Routière"},
            {depart: "17:18", arrivee: "18:12", ligne: "20b", car: "Car 17", dest: "ORLÉANS Gare Routière"},
            {depart: "18:15", arrivee: "18:50", ligne: "20a", car: "Car 19", dest: "ORLÉANS Gare Routière"}
          ]
        },
        {
          id: "neuville_rive",
          nom: "NEUVILLE - Rive du Bois",
          lat: 48.0690, lng: 2.0600,
          horaires: [
            {depart: "06:29", arrivee: "07:12", ligne: "20b", car: "Car 5", dest: "ORLÉANS Gare Routière"},
            {depart: "06:29", arrivee: "07:15", ligne: "20b", car: "Car 7", dest: "ORLÉANS Gare Routière"},
            {depart: "07:08", arrivee: "07:55", ligne: "20b", car: "Car 9", dest: "ORLÉANS Gare Routière"},
            {depart: "07:55", arrivee: "08:30", ligne: "20a", car: "Car 3", dest: "ORLÉANS Gare Routière"},
            {depart: "10:48", arrivee: "11:32", ligne: "20b", car: "Car 15", dest: "ORLÉANS Gare Routière"},
            {depart: "17:29", arrivee: "18:12", ligne: "20b", car: "Car 17", dest: "ORLÉANS Gare Routière"}
          ]
        }
      ]
    };

    // 2. Initialisation Carte
    const map = L.map('map').setView([48.0000, 2.0000], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    DATA.arrets.forEach(a => {
      L.marker([a.lat, a.lng]).addTo(map).bindPopup(`<b>${a.nom}</b>`);
    });

    // 3. Distance GPS
    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 4. API Vacances
    async function checkVacances() {
      const today = new Date().toISOString().split('T')[0];
      const statusBox = document.getElementById('status-box');
      
      try {
        const url = `https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?where=location%3D%22Orl%C3%A9ans-Tours%22%20AND%20start_date%20%3C%3D%20%22${today}%22%20AND%20end_date%20%3E%3D%20%22${today}%22&limit=1`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.total_count > 0) {
          statusBox.className = "vacances";
          statusBox.innerText = "🏖️ Période de Vacances Scolaires";
          document.getElementById('bus-result').innerHTML = "<b>Profite de tes vacances !</b> Il n'y a pas de bus en circulation durant cette période.";
          return true;
        } else {
          statusBox.className = "scolaire";
          statusBox.innerText = "🏫 Période Scolaire";
          return false;
        }
      } catch (e) {
        statusBox.className = "scolaire";
        statusBox.innerText = "🏫 Période Scolaire";
        return false;
      }
    }

    // 5. Calcul du prochain bus
    function findNextBus(userLat, userLng) {
      let arretProche = DATA.arrets[0];
      let distMin = calcDistance(userLat, userLng, DATA.arrets[0].lat, DATA.arrets[0].lng);

      for (let i = 1; i < DATA.arrets.length; i++) {
        let d = calcDistance(userLat, userLng, DATA.arrets[i].lat, DATA.arrets[i].lng);
        if (d < distMin) {
          distMin = d;
          arretProche = DATA.arrets[i];
        }
      }

      const now = new Date();
      const currentHM = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const prochain = arretProche.horaires.find(h => h.depart >= currentHM);
      const resultContainer = document.getElementById('bus-result');

      if (prochain) {
        const badgeClass = prochain.ligne === "20a" ? "badge-20a" : "badge-20b";
        resultContainer.innerHTML = `
          Le prochain bus <span class="${badgeClass}">Ligne ${prochain.ligne}</span> (${prochain.car}) 
          part de <b>"${arretProche.nom}"</b> à <b>${prochain.depart}</b> et arrive à <b>"${prochain.dest}"</b> à <b>${prochain.arrivee}</b>.
        `;
      } else {
        resultContainer.innerHTML = `Plus aucun bus ne passe aujourd'hui à l'arrêt <b>"${arretProche.nom}"</b>.`;
      }

      selectArret(arretProche.id);
    }

    // 6. Tableau et recherche
    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';
      
      DATA.arrets.forEach(a => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${a.id === currentArretId ? 'active' : ''}`;
        btn.innerText = a.nom.split(' - ')[1] || a.nom;
        btn.onclick = () => selectArret(a.id);
        tabsContainer.appendChild(btn);
      });
    }

    function selectArret(arretId) {
      currentArretId = arretId;
      renderTabs();
      filterHoraires();
    }

    function filterHoraires() {
      const arret = DATA.arrets.find(a => a.id === currentArretId);
      const query = document.getElementById('search-destination').value.toLowerCase().trim();
      const tableContainer = document.getElementById('table-container');

      const horairesFiltres = arret.horaires.filter(h => 
        h.dest.toLowerCase().includes(query)
      );

      if (horairesFiltres.length === 0) {
        tableContainer.innerHTML = `<div class="no-result">Aucun bus vers cette destination pour cet arrêt.</div>`;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Départ</th>
              <th>Arrivée</th>
              <th>Ligne</th>
              <th>Car</th>
              <th>Destination</th>
            </tr>
          </thead>
          <tbody>
      `;

      horairesFiltres.forEach(h => {
        const badgeClass = h.ligne === "20a" ? "badge-20a" : "badge-20b";
        html += `
          <tr>
            <td><b>${h.depart}</b></td>
            <td><b>${h.arrivee}</b></td>
            <td><span class="${badgeClass}">${h.ligne}</span></td>
            <td>${h.car}</td>
            <td>${h.dest}</td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      tableContainer.innerHTML = html;
    }

    // 7. Initialisation & Suivi GPS Continu
    async function init() {
      selectArret(DATA.arrets[0].id);
      const enVacances = await checkVacances();

      if (!enVacances && "geolocation" in navigator) {
        // Suivi GPS dynamique en direct
        navigator.geolocation.watchPosition(
          (pos) => {
            const uLat = pos.coords.latitude;
            const uLng = pos.coords.longitude;
            
            if (userMarker) {
              userMarker.setLatLng([uLat, uLng]);
            } else {
              userMarker = L.circleMarker([uLat, uLng], {color: 'red', radius: 8}).addTo(map).bindPopup("Vous êtes ici");
            }
            
            map.setView([uLat, uLng], 12);
            findNextBus(uLat, uLng);
          },
          (err) => {
            document.getElementById('bus-result').innerText = "Activez la géolocalisation pour calculer l'arrêt le plus proche.";
          },
          { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
        );

        // Actualisation du calcul toutes les minutes
        setInterval(() => {
          navigator.geolocation.getCurrentPosition((pos) => {
            findNextBus(pos.coords.latitude, pos.coords.longitude);
          });
        }, 60000);
      }
    }

    init();
  </script>
</body>
</html>
