<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Horaires Rémi 45</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <!-- Card Prochain Bus -->
  <div class="card">
    <h1>🚍 Rémi 45 - Prochain Passage</h1>
    <div id="status-box">Vérification du calendrier...</div>
    <div id="bus-result" class="bus-info">Recherche de l'arrêt le plus proche via GPS...</div>
  </div>

  <!-- Carte Leaflet -->
  <div id="map"></div>

  <!-- Section Grille Horaire avec Recherche et Heures -->
  <div class="card" id="card-horaires">
    <h2>📋 Fiche Horaire Période Scolaire</h2>

    <div class="tabs-container" id="tabs"></div>

    <input 
      type="text" 
      id="search-destination" 
      class="search-box" 
      placeholder="🔍 Chercher une destination (ex: Stade, Rive du Bois, Orléans...)"
      oninput="filterHoraires()">

    <div id="table-container"></div>
  </div>
</body>
</html>
